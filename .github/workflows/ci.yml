# Vulnerable Java App (Gradle, Java 21) — same shape as the BoardGame pipeline:
# every scanner emits SARIF (-> GitHub Security) + a downloadable artifact,
# no OWASP Dependency-Check, plus a Docker build/scan/push job.
# Project files are at the repo ROOT, so no working-directory is needed.
name: Vulnerable-Java-Application CI

on:
  push:
    branches:
      - main
  workflow_dispatch:            # "Run workflow" button for manual runs

permissions:
  contents: read
  security-events: write        # required to upload SARIF to the Security tab

env:
  APP_NAME: Vulnerable Java Application

jobs:
  build:
    name: Build, Test and Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout Step
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------- 1) Secret scanning (early, no build needed) ----------
      - name: Install Gitleaks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gitleaks

      # Gitleaks: one tool, two reports — CSV (readable) + SARIF (Security tab)
      - name: Code Security check (Gitleaks)
        run: |
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format csv   --report-path gitleaks-report.csv
          gitleaks detect --no-git --source . --redact --exit-code 0 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      # Scan ONCE to JSON, then convert the same result to SARIF (no re-scan)
      - name: Trivy secret scan (JSON + SARIF)
        run: |
          trivy fs --scanners secret --offline-scan --skip-files README.md \
            --exit-code 0 --format json --output trivy-secret-report.json .
          trivy convert --format sarif --output trivy-secret.sarif trivy-secret-report.json

      - name: Upload Trivy secret SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('trivy-secret.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

      - name: Upload secret scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-secrets
          path: |
            gitleaks-report.csv
            gitleaks.sarif
            trivy-secret-report.json
            trivy-secret.sarif
          if-no-files-found: warn
          retention-days: 7

      # ---------- 2) Test and build (Gradle, Java 21) ----------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Runs tests and creates the JaCoCo coverage report
      - name: Perform Unit Test
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Build
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ---------- 3) Dependency vulnerability scanning (after build) ----------
      # Trivy reads gradle.lockfile, so it doesn't need to reach Maven Central
      - name: Trivy vulnerability scan (JSON + SARIF)
        run: |
          trivy fs --scanners vuln --exit-code 0 \
            --format json --output trivy-vuln-report.json .
          trivy convert --format sarif --output trivy-vuln.sarif trivy-vuln-report.json

      - name: Upload Trivy vuln SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('trivy-vuln.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vuln

      - name: Upload vulnerability scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-vuln
          path: |
            trivy-vuln-report.json
            trivy-vuln.sarif
          if-no-files-found: warn
          retention-days: 7

      # ---------- 4) Hand-over to the Sonar job ----------
      - name: Upload compiled classes + coverage (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/java/main
            build/reports/jacoco/test
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Restores build/classes/java/main and build/reports/jacoco/test
      - name: Download compiled classes + coverage
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: build

      - name: Check coverage report is present
        run: ls -la build/reports/jacoco/test/jacocoTestReport.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=Java-vuln-project
            -Dsonar.sources=src/main/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [build, sonarqube]        # only after tests, scans and Quality Gate pass
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vulnerable-java-app:${{ github.sha }}

    steps:
      - name: Code Checkout Step       # multi-stage Dockerfile builds from source
        uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Docker Build
        run: docker build -t "$IMAGE" .

      # Scan ONCE to JSON, convert to SARIF (both kept)
      - name: Trivy image scan (JSON + SARIF)
        run: |
          trivy image "$IMAGE" --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --format json --output trivy-image-report.json
          trivy convert --format sarif --output trivy-image.sarif trivy-image-report.json

      - name: Upload Trivy image SARIF to Security tab
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload image scan reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-image
          path: |
            trivy-image-report.json
            trivy-image.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Login & Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push "$IMAGE"
