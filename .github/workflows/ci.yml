name: Vulnerable-Java-Application CI

on:
  push:
    branches:
      - main
  workflow_dispatch:            # "Run workflow" button for manual test runs

permissions:
  contents: read

env:
  APP_NAME: Vulnerable Java Application

# Project files are at the repo root, so no working-directory is needed
jobs:
  build:
    name: Build, Test and Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout Step
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------- 1) Secret scanning (early, no build needed) ----------
      - name: Install Gitleaks
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gitleaks

      - name: Code Security check (Gitleaks)
        run: |
          gitleaks detect --no-git --source . \
            --report-format csv \
            --report-path gitleaks-report.csv \
            --redact

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Trivy secret scan
        run: trivy fs --scanners secret --offline-scan --exit-code 0 --skip-files README.md --format json --output trivy-secret-report.json .

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-secrets
          path: |
            gitleaks-report.csv
            trivy-secret-report.json
          if-no-files-found: warn
          retention-days: 7

      # ---------- 2) Test and build (Gradle, Java 21) ----------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Runs tests and creates the JaCoCo coverage report
      # (needs the jacoco plugin added to build.gradle)
      - name: Perform Unit Test
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Build
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ---------- 3) Dependency vulnerability scanning (after build) ----------
      # Trivy reads gradle.lockfile, so it doesn't need Maven Central
      - name: Trivy vulnerability scan
        run: trivy fs --scanners vuln --format json --output trivy-vuln-report.json .

      - name: Upload vulnerability scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-vuln
          path: trivy-vuln-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk          # stops setup-java's JAVA_HOME breaking the action's container
        with:
          project: 'vulnerable-java-application'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --format JSON
            --exclude "**/reports/**"
            --exclude "**/.gradle/**"
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn
          retention-days: 7

      # ---------- 4) Hand-over to the Sonar job ----------
      - name: Upload compiled classes + coverage (for Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            build/classes/java/main
            build/reports/jacoco/test
          retention-days: 1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Restores build/classes/java/main and build/reports/jacoco/test
      - name: Download compiled classes + coverage
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: build

      - name: Check coverage report is present
        run: ls -la build/reports/jacoco/test/jacocoTestReport.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=vulnerable-java-application
            -Dsonar.sources=src/main/java
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: qg
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Show Quality Gate status
        if: always()
        run: echo "Quality Gate status is ${{ steps.qg.outputs.quality-gate-status }}"
